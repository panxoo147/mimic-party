<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimic Party</title>
<link rel="stylesheet" href="/css/style.css">

<div class="container" style="justify-content:center; max-width:480px;">
  <div class="col center" style="align-items:center; margin-bottom:8px;">
    <h1 class="logo" style="border-bottom:none; margin-bottom:0;"><span class="emoji">🎤</span> Mimic Party</h1>
    <p class="muted small">เกมปาร์ตี้เลียนแบบเสียง เล่นกันสดๆ ในกลุ่มเพื่อน</p>
  </div>

  <a href="/host" class="card col mode-card">
    <div class="row" style="align-items:center; gap:14px; flex-wrap:nowrap;">
      <div class="mode-card-icon">🖥️</div>
      <div class="col" style="gap:2px; min-width:0;">
        <h2 style="margin:0;">เป็น Host</h2>
        <p class="muted small" style="margin:0;">เปิดจอนี้ให้ทุกคนดู แล้วให้เพื่อนสแกน QR เข้าร่วมด้วยมือถือ</p>
      </div>
    </div>
  </a>

  <a href="/join" class="card col mode-card">
    <div class="row" style="align-items:center; gap:14px; flex-wrap:nowrap;">
      <div class="mode-card-icon">📱</div>
      <div class="col" style="gap:2px; min-width:0;">
        <h2 style="margin:0;">เข้าร่วมเกม</h2>
        <p class="muted small" style="margin:0;">มีรหัสห้องแล้ว? กดที่นี่เพื่อใส่รหัสแล้วเล่นผ่านมือถือ</p>
      </div>
    </div>
  </a>

  <footer class="tiny">Mimic Party (fan-made web edition)</footer>
</div>
